spring:
  application:
    name: wallet
  datasource:
    url: jdbc:h2:file:./data/wallet;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

wallet:
  enc-secret: ${WALLET_ENC_SECRET:default-32-byte-secret-key-must-be}
  chain:
    evm-rpc-url: ${EVM_RPC_URL:https://sepolia.infura.io/v3/your-project-id}
    evm-chain-id: ${EVM_CHAIN_ID:11155111}
    btc-network: ${BTC_NETWORK:mainnet}      # mainnet | testnet
    btc-blockstream-url: ${BTC_BLOCKSTREAM_URL:https://blockstream.info/api}
  scanner:
    enabled: true                          # 扫链模块开关（EVM）
    tick-interval-ms: 10000                # EVM tick 间隔（出块 ~12s 所以 10s 合适）
    safe-confirmations: 12                 # EVM 安全确认阈值
    start-from-block: -1
    btc:
      enabled: false                       # BTC 扫链默认关闭，需要时显式开启
      tick-interval-ms: 30000              # BTC 出块 ~10min，30s tick 足够
      safe-confirmations: 3                # BTC 保守 3 个 ≈ 30min

logging:
  level:
    org.hibernate.SQL: WARN
    com.wallet: INFO
